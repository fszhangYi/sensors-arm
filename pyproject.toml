[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensors-arm"
version = "0.1.0"
description = "Multi-arm visualization and control (split from sensors-dcs)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "pydantic>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
elite = ["elirobots>=0.0.7", "loguru>=0.6.0,<0.7"]
kinematics = ["scipy>=1.10"]
dev = ["pytest>=7.0", "scipy>=1.10"]

[project.scripts]
sensors-arm = "sensors_arm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sensors_arm = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
