# sensors-arm — multi-arm dry-run demo (Elite EC616 + Elite CS66)
#
#   sensors-arm run -c configs/default.yaml
#   python -m sensors_arm.desktop_main -c configs/default.yaml --ui
version: 1
site: arm-lab
sensors_config: ./sensors_multi.yaml
models_catalog: ./models_catalog.yaml
dry_run: true
tcp_xyz: [0.0, 0.0, 0.18]

runtime:
  viz_host: "0.0.0.0"
  viz_port: 6008
  viz_hz: 15
  console_hz: 2

# Absolute joint send: T=clamp(d/v_norm, t_min, t_max) + seven-segment α (from sensors-dcs)
arm_abs_ramp:
  t_min_s: 0.1
  t_max_s: 30.0
  v_norm_rad_s: 0.02
  profile: seven_segment
  jerk_seg_frac: 0.10
  accel_seg_frac: 0.15
  ramp_hz: 20.0

arms:
  - id: arm-a
    label: "Cell A · EC616"
    model: elite_ec616
    brand: Elite
    product: EC616
    read_agent: arm-a-read
    write_agent: arm-a-write
    home_joints_rad: [0, -0.4, 0.8, 0, 1.2, 0]
    tcp_xyz: [0.0, 0.0, 0.18]

  - id: arm-b
    label: "Cell B · CS66"
    model: elite_cs66
    brand: Elite
    product: CS66
    read_agent: arm-b-read
    write_agent: arm-b-write
    home_joints_rad: [0.2, -0.3, 0.5, 0, 0.9, 0]
    # Tool TCP (m, flange frame). URDF: flan→gripper_centor≈0.0335 + mesh≈0.09 → ~0.12
    # (was 0.18 copied from EC616, which put the amber ball past the AG95 mesh).
    tcp_xyz: [0.0, 0.0, 0.12]

# agents synthesized from arms: if omitted; explicit list keeps DCS-compatible shape
agents:
  - id: arm-a-read
    type: arm
    sensor_id: arm-a
    hz: 50
    buffer_frames: 64
  - id: arm-a-write
    type: arm_write
    sensor_id: arm-a
    hz: 5
    buffer_frames: 8
  - id: arm-b-read
    type: arm
    sensor_id: arm-b
    hz: 50
    buffer_frames: 64
  - id: arm-b-write
    type: arm_write
    sensor_id: arm-b
    hz: 5
    buffer_frames: 8
