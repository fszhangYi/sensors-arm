# sensors-arm — multi-arm dry-run demo (EC616 + CS66 Cell B + CS66 Cell C/G26562)
#
#   sensors-arm run -c configs/default.yaml
#   python -m sensors_arm.desktop_main -c configs/default.yaml --ui
version: 1
site: arm-lab
sensors_config: ./sensors_multi.yaml
models_catalog: ./models_catalog.yaml
dry_run: false
tcp_xyz: [0.0, 0.0, 0.18]

runtime:
  viz_host: "0.0.0.0"
  viz_port: 6008
  viz_hz: 15
  console_hz: 2

# Absolute joint send: T=clamp(d/v_norm, t_min, t_max) + seven-segment α (from sensors-dcs)
arm_abs_ramp:
  t_min_s: 0.1
  t_max_s: 30.0
  v_norm_rad_s: 0.02
  profile: seven_segment
  jerk_seg_frac: 0.10
  accel_seg_frac: 0.15
  ramp_hz: 20.0

arms:
  - id: arm-a
    label: "Cell A · EC616"
    model: elite_ec616
    brand: Elite
    product: EC616
    read_agent: arm-a-read
    write_agent: arm-a-write
    home_joints_rad: [0, -0.4, 0.8, 0, 1.2, 0]
    tcp_xyz: [0.0, 0.0, 0.18]

  - id: arm-b
    label: "Cell B · CS66"
    model: elite_cs66
    brand: Elite
    product: CS66
    read_agent: arm-b-read
    write_agent: arm-b-write
    # Dry-run home ≈ 交叉验证 IMG_9667 (deg→rad); FK/IK = elite_cs66 MDH.
    home_joints_rad: [0.01044, -1.64208, 2.55021, -2.47928, 1.57057, -0.01733]
    # Flange→EOAT tip (m): KWR75 face 0.0335 + EFG-C65 tip ≈0.117 (mount was CAD -Y).
    # Flange-only check vs teach: set [0,0,0] (amber==blue ball).
    tcp_xyz: [0.0, 0.0, 0.1505]

  - id: arm-c
    label: "Cell C · CS66 G26562"
    model: elite_cs66_g26562
    brand: Elite
    product: CS66
    read_agent: arm-c-read
    write_agent: arm-c-write
    # Home joints (rad); FK/IK = cs66_kin_g26562.
    home_joints_rad: [2.8695, -1.9539, 1.8019, -1.6618, 4.7475, -0.0275]
    tcp_xyz: [0.0, 0.0, 0.1505]

# agents synthesized from arms: if omitted; explicit list keeps DCS-compatible shape
agents:
  - id: arm-a-read
    type: arm
    sensor_id: arm-a
    hz: 50
    buffer_frames: 64
  - id: arm-a-write
    type: arm_write
    sensor_id: arm-a
    hz: 5
    buffer_frames: 8
  - id: arm-b-read
    type: arm
    sensor_id: arm-b
    hz: 50
    buffer_frames: 64
  - id: arm-b-write
    type: arm_write
    sensor_id: arm-b
    hz: 5
    buffer_frames: 8
  - id: arm-c-read
    type: arm
    sensor_id: arm-c
    hz: 50
    buffer_frames: 64
  - id: arm-c-write
    type: arm_write
    sensor_id: arm-c
    hz: 5
    buffer_frames: 8
