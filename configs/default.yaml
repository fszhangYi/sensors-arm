# sensors-arm — multi-arm dry-run demo (EC616 + CS66 Cell B + CS66 Cell C/G26562)
#
#   sensors-arm run -c configs/default.yaml
#   python -m sensors_arm.desktop_main -c configs/default.yaml --ui
version: 1
site: arm-lab
sensors_config: ./sensors_multi.yaml
models_catalog: ./models_catalog.yaml
dry_run: false
tcp_xyz: [0.0, 0.0, 0.18]

runtime:
  viz_host: "0.0.0.0"
  viz_port: 6008
  viz_hz: 15
  console_hz: 2

# Absolute joint send: T=clamp(d/v_norm, t_min, t_max) + seven-segment α (from sensors-dcs)
arm_abs_ramp:
  t_min_s: 0.1
  t_max_s: 30.0
  v_norm_rad_s: 0.02
  profile: seven_segment
  jerk_seg_frac: 0.10
  accel_seg_frac: 0.15
  ramp_hz: 20.0

arms:
  - id: arm-a
    label: "Cell A · EC616"
    model: elite_ec616
    brand: Elite
    product: EC616
    read_agent: arm-a-read
    write_agent: arm-a-write
    home_joints_rad: [0, -0.4, 0.8, 0, 1.2, 0]
    tcp_xyz: [0.0, 0.0, 0.18]
    # No wrist camera on Cell A
    camera:
      enabled: false

  - id: arm-b
    label: "Cell B · CS66"
    model: elite_cs66
    brand: Elite
    product: CS66
    read_agent: arm-b-read
    write_agent: arm-b-write
    # Dry-run home ≈ 交叉验证 IMG_9667 (deg→rad); FK/IK = elite_cs66 MDH.
    home_joints_rad: [0.01044, -1.64208, 2.55021, -2.47928, 1.57057, -0.01733]
    # Flange→EOAT tip (m): KWR75 face 0.0335 + EFG-C65 tip ≈0.117 (mount was CAD -Y).
    # Flange-only check vs teach: set [0,0,0] (amber==blue ball).
    tcp_xyz: [0.0, 0.0, 0.1505]
    # Cell B has no installed D405 — FOV UI hidden
    camera:
      enabled: false

  - id: arm-c
    label: "Cell C · CS66 G26562"
    model: elite_cs66_g26562
    brand: Elite
    product: CS66
    read_agent: arm-c-read
    write_agent: arm-c-write
    # Home joints (rad); FK/IK = cs66_kin_g26562.
    home_joints_rad: [2.8695, -1.9539, 1.8019, -1.6618, 4.7475, -0.0275]
    tcp_xyz: [0.0, 0.0, 0.1505]
    # Wrist D405 on EFG-C65 tooling — FOV defaults (tool frame, mm).
    # Extrinsics are mesh-heuristic; tune in UI (resolution / fx / FOV) as needed.
    camera:
      enabled: true
      camera_model: D405
      frame: "EFG-C65 tool frame (m→mm); X open, Y lateral, Z toward tip"
      units: mm
      lens: [-2.16, 96.0, 123.0]
      look: [0.0183, -0.8119, 0.5835]
      right: [-0.9995, 0.0, 0.0313]
      modes:
        - id: HD87
          label: "1280×720 · 产品页 87×58"
          width: 1280
          height: 720
          H_deg: 87.0
          V_deg: 58.0
          aspect: "16:9"
        - id: HD84
          label: "1280×720 · 手册 84×58"
          width: 1280
          height: 720
          H_deg: 84.0
          V_deg: 58.0
          aspect: "16:9"
        - id: VGA80
          label: "640×480 · ~80×64"
          width: 640
          height: 480
          H_deg: 80.0
          V_deg: 64.0
          aspect: "4:3"
        - id: custom
          label: "自定义（填 W/H + fx/fy 或 H/V）"
          width: 1280
          height: 720
          fx: 650.0
          fy: 650.0
      samples:
        - { name: root_L, xyz: [-12.0, -11.0, 117.0], tag: root }
        - { name: root_R, xyz: [12.0, 11.0, 117.0], tag: root }
        - { name: tip_L, xyz: [-12.0, -11.0, 192.0], tag: blade }
        - { name: tip_R, xyz: [12.0, 11.0, 192.0], tag: blade }
        - { name: hook_c_L, xyz: [-33.0, -11.0, 192.0], tag: hook_c }
        - { name: hook_c_R, xyz: [33.0, 11.0, 192.0], tag: hook_c }
        - { name: hook_o_L, xyz: [-65.0, -11.0, 192.0], tag: hook_o }
        - { name: hook_o_R, xyz: [65.0, 11.0, 192.0], tag: hook_o }
      footprint_depths_mm: [90, 118, 120]
      notes: "Cell C only. Override W/H/fx/fy in UI; H/V degrees take precedence when set."

# agents synthesized from arms: if omitted; explicit list keeps DCS-compatible shape
agents:
  - id: arm-a-read
    type: arm
    sensor_id: arm-a
    hz: 50
    buffer_frames: 64
  - id: arm-a-write
    type: arm_write
    sensor_id: arm-a
    hz: 5
    buffer_frames: 8
  - id: arm-b-read
    type: arm
    sensor_id: arm-b
    hz: 50
    buffer_frames: 64
  - id: arm-b-write
    type: arm_write
    sensor_id: arm-b
    hz: 5
    buffer_frames: 8
  - id: arm-c-read
    type: arm
    sensor_id: arm-c
    hz: 50
    buffer_frames: 64
  - id: arm-c-write
    type: arm_write
    sensor_id: arm-c
    hz: 5
    buffer_frames: 8
